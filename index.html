<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>施工計画書メーカー（電気設備工事）</title>
<meta name="description" content="工事種目をチェックして施工計画書（管理表）をExcelで出力します">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="施工計画書">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>施工計画書メーカー</h1>
  <p>電気設備工事｜総合・工種別の施工計画書を Excel 出力</p>
</header>

<main id="main">
  <section class="card">
    <button type="button" class="card-head" id="infoToggle" aria-expanded="true" aria-controls="infoBody">
      <span class="step">1</span><span class="card-title">工事情報</span><span class="chev" aria-hidden="true"></span>
    </button>
    <div class="card-body" id="infoBody">
      <p class="subhead first">書類の種類</p>
      <div class="seg" id="docType" role="group" aria-label="書類の種類">
        <button type="button" class="seg-btn" data-type="sogo">総合</button>
        <button type="button" class="seg-btn" data-type="koshu">工種別</button>
        <button type="button" class="seg-btn" data-type="kan">施工計画書のみ</button>
        <button type="button" class="seg-btn" data-type="check">チェックシート</button>
      </div>
      <p class="hint" id="docTypeHint"></p>
      <label class="field" id="koshuField" hidden><span>工種</span>
        <select id="f_koshu"></select></label>
      <label class="field"><span>書類名</span>
        <input type="text" id="f_docTitle" autocomplete="off" placeholder="施工計画書"></label>
      <label class="field"><span>工事名</span>
        <input type="text" id="f_kojiName" autocomplete="off" placeholder="例）○○庁舎電気設備改修工事"></label>
      <label class="field"><span>工事場所</span>
        <input type="text" id="f_basho" autocomplete="off"></label>
      <div class="field-row">
        <label class="field"><span>工期（着手）</span><input type="date" id="f_kokiFrom"></label>
        <label class="field"><span>工期（完成）</span><input type="date" id="f_kokiTo"></label>
      </div>
      <label class="field"><span>発注者</span>
        <input type="text" id="f_hacchu" autocomplete="off"></label>
      <label class="field"><span>受注者</span>
        <input type="text" id="f_juchu" autocomplete="organization"></label>
      <div class="field-row">
        <label class="field"><span>現場代理人</span><input type="text" id="f_dairinin" autocomplete="off"></label>
        <label class="field"><span>監理(主任)技術者</span><input type="text" id="f_gijutsu" autocomplete="off"></label>
      </div>
      <div class="field-row">
        <label class="field"><span>作成者</span><input type="text" id="f_sakuseisha" autocomplete="off"></label>
        <label class="field"><span>作成年月日</span><input type="date" id="f_sakuseiBi"></label>
      </div>
      <p class="subhead">工事概要（任意。未入力の欄は空欄で出力）</p>
      <label class="field"><span>工事監理（発注者の部署）</span>
        <input type="text" id="f_kojiKanri" autocomplete="off" placeholder="例）○○地方整備局 ○○営繕事務所"></label>
      <label class="field"><span>監理（工事監理者）</span>
        <input type="text" id="f_kanri" autocomplete="off" placeholder="例）○○設計事務所"></label>
      <label class="field"><span>設計者</span>
        <input type="text" id="f_sekkei" autocomplete="off"></label>
      <div class="field-row">
        <label class="field"><span>建物用途</span><input type="text" id="f_yoto" autocomplete="off" placeholder="例）事務庁舎"></label>
        <label class="field"><span>構造</span><input type="text" id="f_kozo" autocomplete="off" placeholder="例）鉄筋コンクリート造"></label>
      </div>
      <label class="field"><span>地域地区等</span>
        <input type="text" id="f_chiiki" autocomplete="off" placeholder="例）近隣商業地域、準防火地域"></label>
      <label class="field"><span>規模</span>
        <input type="text" id="f_kibo" autocomplete="off" placeholder="例）地上5階 塔屋1階 延床面積3,000m2"></label>
      <div class="field-row">
        <label class="field"><span>消防法上の区分</span><input type="text" id="f_shobo" autocomplete="off" placeholder="例）別表第一 15項"></label>
        <label class="field"><span>施設の分類</span><input type="text" id="f_bunrui" autocomplete="off" placeholder="例）一般の施設"></label>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head static">
      <span class="step">2</span><span class="card-title">工事種目の選択</span>
    </div>
    <div class="card-body">
      <p class="hint">工事種目（章）を開いて、該当する項目にチェックを入れてください。「細目」を開くと細目単位で外せます。</p>
      <div class="toolbar">
        <input type="search" id="filter" placeholder="項目を検索（例：照明、ケーブル）" autocomplete="off" aria-label="項目を検索">
        <button type="button" class="btn ghost" id="clearAll">全解除</button>
      </div>
      <div id="chapters"></div>
      <p class="hint" id="noHit" hidden>該当する項目がありません。</p>
    </div>
  </section>

  <section class="card">
    <div class="card-head static">
      <span class="step">3</span><span class="card-title">出力内容</span>
    </div>
    <div class="card-body">
      <label class="check"><input type="checkbox" id="o_cover"><span>表紙（押印欄つき）</span></label>
      <label class="check"><input type="checkbox" id="o_gaiyo"><span>工事概要</span></label>
      <label class="check"><input type="checkbox" id="o_soshiki"><span>組織表・電気保安体制・品質管理体制</span></label>
      <label class="check"><input type="checkbox" id="o_tenpu"><span>総合施工計画書の添付シート（工程表・工種別一覧・安全衛生・連絡網・仮設計画）</span></label>
      <label class="check"><input type="checkbox" id="o_kanri"><span>管理表（品質計画）</span></label>
      <label class="check"><input type="checkbox" id="o_check"><span>品質管理チェックシート（工種別の別添1）</span></label>
      <label class="check"><input type="checkbox" id="o_hannyu"><span>機器搬入計画書・体制表・ワイヤロープの選定ほか（搬入・据付け工事）</span></label>
      <label class="check"><input type="checkbox" id="o_list"><span>対象工事種目一覧</span></label>
      <label class="check"><input type="checkbox" id="o_docs"><span>作成・提出資料一覧</span></label>
      <label class="check"><input type="checkbox" id="o_photos"><span>写真撮影項目一覧</span></label>
      <label class="check"><input type="checkbox" id="o_page"><span>管理表に「掲載ページ」列を含める</span></label>
      <p class="hint">出力内容と書類名は「書類の種類」を切り替えると初期値に戻ります。管理表は、選択した工事種目ごとに1シートずつ出力します。</p>
      <div id="result" class="result" hidden>
        <p id="resultName"></p>
        <div class="result-btns">
          <a class="btn" id="dlLink" href="#">ダウンロード</a>
          <button type="button" class="btn ghost" id="shareBtn" hidden>共有・ファイルに保存</button>
        </div>
      </div>
      <p class="error" id="error" hidden></p>
    </div>
  </section>

  <p class="source">出典：国土交通省「電気設備工事 施工管理 管理表（令和8年版）」をもとに作成</p>
</main>

<footer class="bar">
  <div class="bar-info" id="summary">未選択</div>
  <button type="button" class="btn primary" id="exportBtn">Excel出力</button>
</footer>

<script src="vendor/exceljs.min.js"></script>
<script src="data/kanrihyo.js"></script>
<script src="data/checklist.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
